services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: privatecopy
      POSTGRES_USER: privatecopy
      POSTGRES_PASSWORD: privatecopy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatecopy"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    build: .
    env_file: .env
    environment:
      APP_BIND_ADDR: 0.0.0.0:8080
      APP_DATABASE_URL: postgres://privatecopy:privatecopy@postgres:5432/privatecopy
      APP_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
