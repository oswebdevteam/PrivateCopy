[package]
name = "privatecopy-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
ed25519-dalek = "2.2"
futures-util = "0.3"
hkdf = "0.12"
http = "1.3"
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
near-account-id = "2.3"
rand = "0.9"
redis = { version = "0.32", features = ["aio", "connection-manager", "streams", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.40", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1.2", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
